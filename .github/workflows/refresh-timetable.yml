# Keeps the live timetable fresh even when nobody opens the site.
#
# In "link" mode the site only re-downloads the official sheet when someone visits, so the phone
# calendar feed, "what changed" highlights and next-day reminders could fall behind on quiet days.
# This asks the site to re-download it every 3 hours. It uses the site's public, rate-limited
# refresh endpoint, so no secret is needed. GitHub may start scheduled runs a few minutes late.
#
# In "relay" mode (the Apps Script pushes the sheet every ~10 minutes) there is nothing to pull,
# so the job instead checks the relay is alive: if it hasn't checked in for 45 minutes the run
# fails, shows red, and GitHub emails a notice — so a stuck relay is noticed within ~3 hours.
#
# Run it by hand from the Actions tab ("Refresh timetable" → "Run workflow").

name: Refresh timetable

on:
  schedule:
    # Every 3 hours at :17 UTC (5:47 am, 8:47 am, … in India). Off the hour, because GitHub delays jobs queued at :00.
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: refresh-timetable
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE_URL: https://section-e-lilac.vercel.app
    steps:
      - name: Ask the site to re-download the timetable
        run: |
          set -euo pipefail
          code=$(curl -sS --retry 3 --retry-delay 20 --retry-all-errors --max-time 90 \
            -o body.json -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' -d '{}' \
            "$SITE_URL/api/timetable/refresh")
          echo "HTTP $code"
          cat body.json; echo

          if [ "$code" = "429" ]; then
            echo "Someone refreshed it in the last minute, so it is already fresh."
            exit 0
          fi
          if [ "$code" != "200" ]; then
            echo "::error::The site answered HTTP $code."
            exit 1
          fi

          status=$(jq -r '.status // ""' body.json)
          mode=$(jq -r '.mode // ""' body.json)
          checked=$(jq -r '.checkedAt // ""' body.json)
          message=$(jq -r '.error.message // ""' body.json)

          if [ "$status" = "disabled" ]; then
            echo "The timetable is switched off in /admin/timetable; nothing to do."
            exit 0
          fi
          if [ "$mode" = "relay" ]; then
            if [ "$status" = "pending" ]; then
              echo "::error::The relay has never sent the timetable. Check the Apps Script trigger."
              exit 1
            fi
            if [ -z "$checked" ]; then
              echo "::error::The site did not say when the relay last checked in (status: $status). $message"
              exit 1
            fi
            age=$(( $(date -u +%s) - $(date -u -d "$checked" +%s) ))
            mins=$(( age / 60 ))
            if [ "$age" -gt 2700 ]; then
              echo "::error::The Apps Script relay last checked in ${mins} minutes ago (at $checked). It normally checks in every 10 minutes — open the Apps Script project and look at its trigger and executions."
              exit 1
            fi
            echo "Relay is alive: last check-in ${mins} minutes ago ($checked)."
            exit 0
          fi
          if [ "$mode" != "link" ]; then
            echo "The site is in \"$mode\" mode: the timetable is pushed to it, so there is nothing to pull."
            exit 0
          fi
          if [ "$status" = "ok" ]; then
            echo "Timetable refreshed (checked at $checked)."
            exit 0
          fi
          # stale / error / unconfigured: fail the run so it shows red and GitHub emails a notice.
          echo "::error::Timetable refresh did not succeed (status: $status). $message"
          exit 1
